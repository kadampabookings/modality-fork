<html lang="zh" dir="ltr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 Kadampa Bookings</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #1f2937;
        }
        .wrapper {
            width: 100%;
            padding: 32px 16px;
            box-sizing: border-box;
        }
        .email-container {
            max-width: 560px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
        }
        .brand-bar {
            padding: 28px 24px 4px;
            text-align: center;
        }
        .brand {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: #009fe3;
            text-transform: uppercase;
        }
        .content {
            padding: 8px 40px 32px;
        }
        h1 {
            margin: 16px 0 8px;
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            text-align: center;
        }
        p.lead {
            margin: 0 0 24px;
            font-size: 15px;
            line-height: 1.55;
            color: #475569;
            text-align: center;
        }
        .cta-wrap {
            text-align: center;
            margin: 28px 0 16px;
        }
        .cta-btn {
            display: inline-block;
            background-color: #009fe3;
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 36px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
        }
        .fallback {
            margin: 16px 0 0;
            font-size: 12px;
            line-height: 1.55;
            color: #94a3b8;
            text-align: center;
        }
        .fallback a {
            color: #009fe3;
            text-decoration: underline;
            word-break: break-all;
        }
        .divider-or {
            width: 60%;
            margin: 32px auto 24px;
            border: 0;
            border-top: 1px solid #e2e8f0;
            position: relative;
            height: 1px;
        }
        .divider-or::after {
            content: '或者';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            padding: 0 12px;
            color: #94a3b8;
            font-size: 12px;
            letter-spacing: 0.12em;
        }
        .code-section {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .code-section h2 {
            margin: 0 0 14px;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }
        .verification-code {
            display: inline-block;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Courier New', monospace;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.4em;
            color: #0f172a;
            background-color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }
        .code-hint {
            margin: 14px 0 0;
            font-size: 12px;
            color: #94a3b8;
        }
        .footer {
            padding: 24px 40px 32px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.6;
        }
        .footer strong {
            color: #475569;
        }
    </style>
</head>

<body>
<div class="wrapper">
    <div class="email-container">

        <div class="brand-bar">
            <div class="brand">Kadampa Bookings</div>
        </div>

        <div class="content">
            <h1>登录到您的账户</h1>

            <p class="lead">
                点击下方按钮安全登录您的 Kadampa Bookings 账户。
                无需密码。
            </p>

            <div class="cta-wrap">
                <a href="[magicLink]" class="cta-btn">登录</a>
            </div>

            <p class="fallback">
                按钮不起作用？复制此链接并粘贴到您的浏览器：<br>
                <a href="[magicLink]">[magicLink]</a>
            </p>

            <hr class="divider-or">

            <div class="code-section">
                <h2>更喜欢代码？在登录页面输入</h2>
                <div class="verification-code">[verificationCode]</div>
                <p class="code-hint">此代码和上面的链接将在 10 分钟后过期。</p>
            </div>

        </div>

        <div class="footer">
            <p>
                如果您没有请求此操作，您可以安全地忽略此电子邮件 — 无需采取任何操作。<br>
                <strong>Kadampa Booking System</strong>
            </p>
        </div>

    </div>
</div>
</body></html>
