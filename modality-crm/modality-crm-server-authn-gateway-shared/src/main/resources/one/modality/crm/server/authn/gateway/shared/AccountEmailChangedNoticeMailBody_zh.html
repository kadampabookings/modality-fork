<html lang="zh" dir="ltr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录邮箱已更改</title>
    <style>
        /* Global Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f9fafb;
        }

        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
        }

        .header {
            background-color: #ffffff;
            padding: 20px 0;
            font-size: 32px;
            color: #009fe3;
            font-weight: bold;
        }

        .content {
            padding: 20px 40px;
            font-size: 16px;
            color: #505050;
        }

        .content h2 {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: normal;
            color: #606060;
        }

        .address {
            font-weight: bold;
            color: #303030;
        }

        .divider {
            width: 80%;
            margin: 20px auto;
            border: 0;
            border-top: 1px solid #dddddd;
        }

        .footer {
            font-size: 12px;
            color: #aaaaaa;
            margin: 20px 0;
        }
    </style>
</head>

<body>
<div class="email-container">
    <div class="header">登录邮箱已更改</div>

    <div class="content">
        <h2>尊敬的用户：</h2>

        <p>您在 Kadampa Bookings 上用于登录账户的邮箱刚刚从此地址更改为 <span class="address">[newEmail]</span>。</p>

        <hr class="divider">

        <p>如果这是您本人进行的更改，则无需任何操作。</p>

        <p>如果不是您本人，可能有其他人正在使用您的账户。请立即回复此邮件，以便我们帮助您找回账户。</p>
    </div>

    <div class="footer">
        <p>每当账户的登录邮箱发生更改时，都会向该账户之前的地址发送此通知。</p>
    </div>
</div>
</body></html>
