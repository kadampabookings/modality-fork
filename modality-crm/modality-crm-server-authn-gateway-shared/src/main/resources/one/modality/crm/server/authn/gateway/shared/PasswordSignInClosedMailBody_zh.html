<html lang="zh" dir="ltr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码登录已关闭</title>
    <style>
        /* Global Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f9fafb;
        }

        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
        }

        .header {
            background-color: #ffffff;
            padding: 20px 0;
            font-size: 32px;
            color: #009fe3;
            font-weight: bold;
        }

        .content {
            padding: 20px 40px;
            font-size: 16px;
            color: #505050;
        }

        .content h2 {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: normal;
            color: #606060;
        }

        .address {
            font-weight: bold;
            color: #303030;
        }

        .divider {
            width: 80%;
            margin: 20px auto;
            border: 0;
            border-top: 1px solid #dddddd;
        }

        .footer {
            font-size: 12px;
            color: #aaaaaa;
            margin: 20px 0;
        }
    </style>
</head>

<body>
<div class="email-container">
    <div class="header">密码登录已关闭</div>

    <div class="content">
        <h2>尊敬的用户：</h2>

        <p>有人请求以不使用密码的方式进入您的 Kadampa Bookings 账户：登录链接、验证码或重置密码。这可能是您本人。</p>

        <p>此账户已关闭密码登录，因此没有发送任何可以打开账户的内容。在密码可能已泄露期间，这样可以保护您的账户。</p>

        <p><strong>请使用您的通行密钥登录。</strong></p>

        <hr class="divider">

        <p>如果您已不再拥有存有通行密钥的设备，请回复此邮件，我们会帮助您重新登录。</p>
    </div>

    <div class="footer">
        <p>当账户的密码登录处于关闭状态时，会发送此通知以代替登录链接或密码重置。</p>
    </div>
</div>
</body></html>
