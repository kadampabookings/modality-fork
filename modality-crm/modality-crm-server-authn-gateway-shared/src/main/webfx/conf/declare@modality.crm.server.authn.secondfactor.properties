# Back-office second-factor policy. UNSET means off: the password alone opens the back office,
# exactly as it did before this existed, and enrolled factors are ignored at login (enrolment and
# management stay available on both apps). The boot log prints the resolved policy on every start —
# silence would otherwise read as success.
#
# backofficePolicy = off | optional | required
#   off       the default, and what an unset, unresolved or unrecognised value means. A typo must
#             land on the behaviour that was already shipping, visibly in the log, not on a surprise.
#   optional  an account with a CONFIRMED factor is asked for it on every back-office login; an
#             account without one is not. Front-office logins are never asked: the requirement
#             attaches to back-office authentication, not to the account, which is what keeps
#             enrolment reachable from the front office for someone who would otherwise be locked out.
#   required  as optional, and additionally a back-office login by an account with no confirmed
#             factor is refused — but only from requiredFrom onwards (see below).
#
# WHAT `optional` AND `required` DO NOT DO YET — read this before treating either as a control.
# The policy is enforced at ONE place: the username/password login. These other ways into a
# back-office session do not pass through it at all, and are unaffected by anything set here:
#   - a magic link or an emailed verification code redeemed on a back-office connection;
#   - a support view pass and a back-office view pass;
#   - the guest cart login;
#   - a FRONT-OFFICE login of the same account — nothing stops that session's messages reaching the
#     back office, because a session does not yet say which app it was established for.
# The last one is the audience binding ($aud), milestone M1 of
# docs/security/backoffice-second-factor-totp-design.md; the others close as each mint site moves
# behind the shared session minter described there. Until then `optional` and `required` raise the
# cost of a cracked back-office password — they do not fence the back office, and a green deploy of
# this setting is not evidence that they do. The server repeats this in its boot log whenever the
# policy is not `off`.
#
# requiredFrom = an ISO date, e.g. 2026-11-01. Only meaningful for `required`, and only a DATE: the
# grace deadline is a day, evaluated in the server's time zone. `required` with no date, or a date
# that does not parse, behaves as `optional` and says so loudly once at boot — refusing every login
# because a date was mistyped is not a safety property. The grace period is also the whole hole for
# as long as it lasts, so it is a decision, not a default.
#
# Declared bare (no "| default") on purpose: a `${{ VAR | default }}` declaration ignores a value set
# in a conf FILE and uses the default (env vars are unaffected) — see
# declare@webfx.stack.session.token.properties for the same trap spelled out, and
# declare@modality.crm.server.authn.webauthn.properties for the same discipline.
#
# AND: a declare@ file in a module is read ONLY once `webfx update` has merged it into the server
# application's generated src-root.json (kbs3/kbs-server-application-vertx/src/main/resources/
# dev/webfx/platform/conf/). That step was missed on 2026-09-13: the passkey plugin's declare@ file
# was in place and every variable set, and the gateway still booted inert on localhost and on
# staging. Until it is merged, this module reads nothing and the policy stays off.
backofficePolicy = ${{ BACKOFFICE_SECOND_FACTOR }}
requiredFrom = ${{ BACKOFFICE_SECOND_FACTOR_REQUIRED_FROM }}
