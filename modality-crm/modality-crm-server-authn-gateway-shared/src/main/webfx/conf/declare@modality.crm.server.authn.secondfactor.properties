# Back-office second-factor policy. UNSET means off: the password alone opens the back office,
# exactly as it did before this existed, and enrolled factors are ignored at login (enrolment and
# management stay available in the BACK-OFFICE profile — see below). The boot log prints the
# resolved policy on every start — silence would otherwise read as success.
#
# WHERE ENROLMENT LIVES (product decision, 2026-09-14): the authenticator app and passkeys are
# BACK-OFFICE features. The front office keeps password, magic link and verification code and shows
# no second-factor UI at all, so the only place to enrol is the back-office profile (avatar menu).
#
# backofficePolicy = off | optional | required
#   off       the default, and what an unset, unresolved or unrecognised value means. A typo must
#             land on the behaviour that was already shipping, visibly in the log, not on a surprise.
#   optional  an account with a CONFIRMED factor is asked for it on every back-office login; an
#             account without one is not. Front-office logins are never asked: the requirement
#             attaches to back-office authentication, not to the account. (Until 2026-09-14 that
#             also read as the escape hatch — "enrolment stays reachable from the front office for
#             someone who would otherwise be locked out". That argument is VOID: the front office
#             no longer has the section.)
#   required  SETUP FIRST (2026-11-06), from the deploy that sets it — not from the date: a back-office password
#             login by an account with no APPROVED factor gets a SETUP-ONLY session (front-office audience: the back
#             office refuses it everywhere) in which its owner adds a device; an emailed link or code gets a
#             recovery-only session (choose a new password, nothing else); back-office sessions that proved no factor
#             are ended at boot. Nobody is refused, before or after requiredFrom (2026-11-07): the first device
#             waits for a super administrator, which `required` forces on (factorApproval reads as on). See
#             SecondFactorAccess.
#             Before setting it: the legacy GWT back office cannot answer the second-factor step (retire it first),
#             and both super administrators must already hold an approved factor (the boot log warns otherwise).
#
# WHAT IS ENFORCED, under `optional` and `required`: the password login asks an account holding an approved factor
# for it; an emailed link or code redeemed for such an account on the back office opens a recovery-only session; a
# front-office session presented to the back office is refused by the $aud guards (M1); view passes follow the
# agent's own session. Not covered: the legacy GWT back office, which fails closed once an account holds a factor.
#
# requiredFrom = an ISO date, e.g. 2026-11-01. Only meaningful for `required`, and only a DATE: the
# set-up-by date, a day evaluated in the server's time zone; after it, accounts still without a device
# show as overdue to the super administrators. `required` with no date, or a date that does not parse,
# behaves as `optional` and says so loudly once at boot — a mistyped date must not change what the
# server enforces.
#
# Declared bare (no "| default") on purpose: a `${{ VAR | default }}` declaration ignores a value set
# in a conf FILE and uses the default (env vars are unaffected) — see
# declare@webfx.stack.session.token.properties for the same trap spelled out, and
# declare@modality.crm.server.authn.webauthn.properties for the same discipline.
#
# AND: a declare@ file in a module is read ONLY once `webfx update` has merged it into the server
# application's generated src-root.json (kbs3/kbs-server-application-vertx/src/main/resources/
# dev/webfx/platform/conf/). That step was missed on 2026-09-13: the passkey plugin's declare@ file
# was in place and every variable set, and the gateway still booted inert on localhost and on
# staging. Until it is merged, this module reads nothing and the policy stays off.
backofficePolicy = ${{ BACKOFFICE_SECOND_FACTOR }}
requiredFrom = ${{ BACKOFFICE_SECOND_FACTOR_REQUIRED_FROM }}

# factorApproval = on | anything else — the FIRST-FACTOR approval switch, the same variable as the passkey gateway's
# backofficeApproval (WEBAUTHN_BACKOFFICE_APPROVAL). Read here too so the TOTP gateway, the status call and the
# super-administrator approval queue answer from one place. On: an account's FIRST passkey or authenticator app is
# stored PENDING until another super administrator approves it; a later one is approved at once when the same tab
# proved an approved factor in the last 5 minutes. Production only — leave it unset on staging and locally.
factorApproval = ${{ WEBAUTHN_BACKOFFICE_APPROVAL }}
#
# ipLocationDatabase = path to an offline IP-to-city database in MaxMind DB format (DB-IP "IP to City Lite",
# CC BY 4.0, refreshed monthly with the deploy image). Used ONLY to show super administrators where a device
# request came from; no IP ever leaves the server. Unset or unreadable = no location, never a failure.
ipLocationDatabase = ${{ IP_LOCATION_DATABASE }}
