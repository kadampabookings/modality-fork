# The key that encrypts every staff TOTP secret at rest (AES-256-GCM, one 12-byte nonce per row,
# the account id as additional authenticated data so a ciphertext copied onto another account's row
# does not decrypt). base64, at least 32 bytes decoded: a shorter value is REFUSED rather than
# padded, because a key that looks configured and protects nothing is the worst of both.
#
# When encryptionKey is UNSET the plugin boots INERT and says so on every start:
#   - enrolment is refused with AuthnTotpEnrolmentError — no new secret is written that nothing
#     could ever read back;
#   - and — the half that matters — an account that ALREADY holds a totp_credential row is treated
#     as ENROLLED, so its back-office login is refused with a logged reason instead of quietly
#     falling back to password-only. Degrading to one factor for exactly the people who opted into
#     two would be the worst available outcome, so it fails closed.
#
# previousEncryptionKey exists for rotation only: decryption tries the current key first, then this
# one, so a rotation can be deployed without a flag day and rows re-encrypt lazily at their next
# successful use. Unset it once no row still carries the old key_id.
#
# A dedicated key, NOT the session-token signing key: a different primitive (an HMAC key must not
# double as an AES key), a different lifetime (a signing key rotates in days; a TOTP secret lives as
# long as the phone), and a different blast radius (a leaked signing key mints identities until it is
# rotated; a leaked TOTP key reveals every staff second factor at rest — the two must not be one
# compromise).
#
# BOTH ARE SECRETS. They belong in the deployment's SECRET variables beside
# SESSION_TOKEN_SIGNING_KEY — never in public-variables.properties.tpl, never in a committed conf
# file, never in a log (the boot line says whether a key was usable, never what it was).
#
# Declared bare (no "| default") on purpose: a `${{ VAR | default }}` declaration ignores a value set
# in a conf FILE and uses the default instead (env vars are unaffected) — see
# declare@webfx.stack.session.token.properties for the same trap spelled out.
#
# AND: a declare@ file in a module is only read once `webfx update` has merged it into the server
# application's GENERATED src-root.json
# (kbs3/kbs-server-application-vertx/src/main/resources/dev/webfx/platform/conf/). That step is the
# one that was missed on 2026-09-13: the passkey plugin's declare file was in place, every variable
# was set, and the gateway still booted inert on localhost and on staging. Set the variables AND run
# `webfx update`, then check the boot log.
encryptionKey = ${{ TOTP_ENCRYPTION_KEY }}
previousEncryptionKey = ${{ TOTP_PREVIOUS_ENCRYPTION_KEY }}
