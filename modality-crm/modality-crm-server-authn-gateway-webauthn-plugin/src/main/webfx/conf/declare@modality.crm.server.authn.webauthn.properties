# Passkey (WebAuthn) relying-party identity. When rpId or every origin list is UNSET the gateway
# boots inert: every passkey credential type is refused with AuthnPasskeyNotConfiguredError and
# the rest of authentication is untouched.
#
# PASSKEYS ARE BACK-OFFICE ONLY (product decision, 2026-09-14), WITH ONE EXCEPTION (2026-09-18):
# staff may SIGN IN to the front office with a passkey, so that one who stopped their password
# working (V0096) still has a way in. WEBAUTHN_FRONTOFFICE_ORIGINS carries the origin(s) for that; in
# the AWS deploys it defaults to FRONTOFFICE_ORIGIN, the host that deploy serves the front office on,
# so the two cannot drift apart (see the workflows for the two cases that override it). The front
# office still shows no passkey UI — it offers one through the browser's
# autofill only — enrolment is still refused from a front-office origin, and a front-office passkey
# sign-in still resolves only a back-office account and applies the same approval gate. Left unset,
# the exception is simply off: no front-office ceremony of any kind succeeds, and an account whose
# password is closed has no way into the front office.
#
# DO NOT narrow rpId to the back-office host to achieve the same thing. rpId is FOREVER: every
# registered passkey is scoped to it, and every passkey ALREADY registered is bound to the current
# value — narrowing it orphans them all (users must re-register), and it would still not refuse a
# front-office ceremony that the origin allowlist accepts. Prod uses the registrable domain
# (kadampabookings.org), which spans the apex and backoffice.* and must stay that way; staging uses
# staging.kadampabookings.org so staging-minted passkeys never surface in prod account pickers;
# local dev uses localhost (a WebAuthn-valid secure context, spanning the Vite ports).
#
# The two origin lists are comma-separated EXACT origins the server accepts inside the signed
# clientDataJSON; the ceremony allowlist is their union, so an origin in NEITHER list is refused at
# the signed-origin check — for registration as well as for login. An origin is exact: scheme, host
# and port, no path and no wildcard, so every host the app is served on needs its own entry (the
# apex and www are two origins; so are two Vite ports in local dev). An empty frontofficeOrigins is
# therefore not a misconfiguration but the off state of the exception above: a passkey can then be
# neither enrolled nor asserted from the front office, whatever a client chooses to render. The boot
# log states which of the two front-office states this server is in.
#
# They are separate keys on purpose: the gateway derives a login's back-office context from the
# VERIFIED origin and fences the frontend_account.backoffice flag on it, so a back-office origin
# accidentally listed as front-office would fail every BO passkey login with a generic error. Two
# lists make that mistake visible instead — the boot log prints both counts, and 0 back-office
# origins is an obvious misconfiguration.
#   frontofficeOrigins e.g. https://kadampabookings.org (the deploys pass FRONTOFFICE_ORIGIN here)
#   backofficeOrigins  e.g. https://backoffice.kadampabookings.org
#
# Declared bare (no "| default") on purpose: a `${{ VAR | default }}` declaration ignores a
# value set in a conf FILE and uses the default (env vars are unaffected) — see
# declare@webfx.stack.session.token.properties for the same trap spelled out.
rpId = ${{ WEBAUTHN_RP_ID }}
rpName = ${{ WEBAUTHN_RP_NAME }}
frontofficeOrigins = ${{ WEBAUTHN_FRONTOFFICE_ORIGINS }}
backofficeOrigins = ${{ WEBAUTHN_BACKOFFICE_ORIGINS }}

# Passkey approval switch: `on` | `off`; unset, unresolved or anything else means off. It does NOT
# decide who may enter the back office — the account's `backoffice` flag alone does, and the
# gateway fences every passkey login on that flag (from the verified origin) exactly as the
# password path does. It decides whether a passkey must ALSO be approved by a super administrator
# before it opens the back office: the "trusted as a second factor" gate, which only matters once
# the passkey is the factor that matters (phase 2 of docs/security/backoffice-second-factor.md),
# so it is kept dormant until then. Off: new passkeys are stored APPROVED and every passkey is
# usable at once (a PENDING row enrolled earlier too). On: new passkeys start PENDING and the
# super-administrator queue decides. REJECTED is refused either way. The status column and the
# queue (migration V0089) stay in the database regardless — the plugin, not the migration, gives
# a status its meaning. Bare like the four above (same `| default` trap).
backofficeApproval = ${{ WEBAUTHN_BACKOFFICE_APPROVAL }}
