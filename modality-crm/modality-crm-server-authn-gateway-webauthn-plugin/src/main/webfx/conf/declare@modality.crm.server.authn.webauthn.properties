# Passkey (WebAuthn) relying-party identity. When rpId or every origin list is UNSET the gateway
# boots inert: every passkey credential type is refused with AuthnPasskeyNotConfiguredError and
# the rest of authentication is untouched.
#
# rpId is FOREVER: every registered passkey is scoped to it. Renaming domains or changing rpId
# later orphans all registered passkeys (users must re-register). Prod uses the registrable
# domain (kadampabookings.org) so ONE passkey serves the front office (apex) and the back office
# (backoffice.*); staging uses staging.kadampabookings.org so staging-minted passkeys never
# surface in prod account pickers; local dev uses localhost (a WebAuthn-valid secure context,
# spanning the Vite ports).
#
# The two origin lists are comma-separated EXACT origins the server accepts inside the signed
# clientDataJSON; the ceremony allowlist is their union. They are separate keys on purpose: the
# gateway derives a login's back-office context from the VERIFIED origin and fences the
# frontend_account.backoffice flag on it, so a back-office origin accidentally listed as
# front-office would fail every BO passkey login with a generic error. Two lists make that
# mistake visible instead — the boot log prints both counts, and 0 back-office origins is
# an obvious misconfiguration.
#   frontofficeOrigins e.g. https://kadampabookings.org
#   backofficeOrigins  e.g. https://backoffice.kadampabookings.org
#
# Declared bare (no "| default") on purpose: a `${{ VAR | default }}` declaration ignores a
# value set in a conf FILE and uses the default (env vars are unaffected) — see
# declare@webfx.stack.session.token.properties for the same trap spelled out.
rpId = ${{ WEBAUTHN_RP_ID }}
rpName = ${{ WEBAUTHN_RP_NAME }}
frontofficeOrigins = ${{ WEBAUTHN_FRONTOFFICE_ORIGINS }}
backofficeOrigins = ${{ WEBAUTHN_BACKOFFICE_ORIGINS }}
