<html lang="zh" dir="ltr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户已存在</title>
    <style>
        /* Global Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f9fafb;
        }

        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
        }

        .header {
            background-color: #ffffff;
            padding: 20px 0;
            font-size: 32px;
            color: #009fe3;
            font-weight: bold;
        }

        .content {
            padding: 20px 40px;
            font-size: 16px;
            color: #505050;
        }

        .content h2 {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: normal;
            color: #606060;
        }

        .divider {
            width: 80%;
            margin: 20px auto;
            border: 0;
            border-top: 1px solid #dddddd;
        }

        .button-container {
            margin: 20px 0;
        }

        .button {
            display: inline-block;
            background-color: #009fe3;
            color: #ffffff;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }

        .link {
            font-size: 14px;
            color: #009fe3;
            text-decoration: none;
            word-wrap: break-word;
        }

        .footer {
            font-size: 12px;
            color: #aaaaaa;
            margin: 20px 0;
        }
    </style>
</head>

<body>
<div class="email-container">
    <div class="header">账户已存在</div>

    <div class="content">
        <h2>尊敬的用户</h2>

        <p>您收到此邮件是因为您请求在 Kadampa Bookings 创建新账户。</p>

        <p>但是，已存在与此邮箱地址关联的账户。</p>

        <hr class="divider">

        <p>点击下方按钮继续恢复您的账户：</p>

        <div class="button-container">
            <a href="[magicLink]" style="color:white" class="button">恢复账户</a>
        </div>

        <p>或者，您可以点击或将此链接复制粘贴到浏览器中。此链接仅可使用一次：</p>
        <a href="[magicLink]" class="link">
            [magicLink]
        </a>
    </div>

    <div class="footer">
        <p>如果您未发起此请求，请忽略此邮件。<br>无需任何操作。</p>
    </div>
</div>



</body></html>
