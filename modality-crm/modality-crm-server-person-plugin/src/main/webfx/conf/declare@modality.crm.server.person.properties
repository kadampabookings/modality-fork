# What the server needs to send a member email itself, rather than letting the browser compose one.
#
# The member emails (invitation asked, invitation approved, bookings claimed) used to be inserted by
# the front office as Mail + Recipient rows: it chose the destination address, the sending account and
# the body, and it was handed the invitation TOKEN so it could build the approve/decline links. That is
# the mail relay the front-office write-authorization plan closes — anything the browser can address,
# anyone can address.
#
# The server now owns the destination (the person the operation acted on), the sending account, and
# every URL in the body. The browser still supplies the translated prose, which is why these two keys
# exist: without them the server cannot build a link or address a mail, and it will SKIP sending rather
# than produce a mail with broken links or an unresolved sender. That is deliberate — the operation
# still succeeds, and a missing email is recoverable where a wrong one is not.

# Origin of the front office these links point at, with NO trailing slash, e.g.
# https://kadampabookings.org. The AWS deploys pass FRONTOFFICE_ORIGIN, the host that deploy serves the
# front office on. It must be OUR origin and never anything a caller supplies: the links carry an
# invitation token, so an attacker-chosen origin would be handed the capability by the invitee's own
# mail client.
frontofficeBaseUrl = ${{ FRONTOFFICE_ORIGIN }}

# The mail account these are sent FROM — its verified address becomes the From header (MailTransmitter
# reads the account, not the mail's fromEmail, which becomes Reply-To). 27 is the KBS system account,
# the value the front office used to hardcode; it is the same row in staging, which is a copy of
# production. Overridable per environment for anywhere that is not.
mailAccountId = 27
