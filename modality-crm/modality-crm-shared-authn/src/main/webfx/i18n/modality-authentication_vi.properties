AuthnBackofficeMethodNotAllowedError=Cách đăng nhập này không thể mở back-office.
AuthnNoSuchUserAccountError=Không tồn tại tài khoản người dùng như vậy
AuthnOldPasswordNotMatchingError=Mật khẩu cũ không khớp
AuthnPasskeyAdminNotPermittedError=Chỉ quản trị viên cấp cao mới có thể phê duyệt hoặc từ chối khóa truy cập.
AuthnPasskeyError=Đăng nhập bằng khóa truy cập không thành công. Vui lòng thử lại hoặc dùng phương thức đăng nhập khác.
AuthnPasskeyManagementError=Không thể hoàn tất thay đổi khóa truy cập. Vui lòng thử lại.
AuthnPasskeyNotApprovedError=Khóa truy cập này chưa được phê duyệt để dùng cho back-office. Quản trị viên cần phê duyệt trước.
AuthnPasskeyNotConfiguredError=Đăng nhập bằng khóa truy cập không khả dụng trên máy chủ này.
AuthnPasskeyRegistrationError=Không thể đăng ký khóa truy cập. Vui lòng thử lại.
AuthnSecondFactorAttemptsExceededError=Quá nhiều lần thử. Vui lòng đăng nhập lại để bắt đầu lại.
AuthnSecondFactorCodeError=Mã này không đúng. Vui lòng kiểm tra ứng dụng xác thực của bạn và thử lại.
AuthnSecondFactorNotEnrolledError=Tài khoản này cần yếu tố thứ hai để vào back-office. Hãy thiết lập trong hồ sơ của bạn trên trang đặt chỗ.
AuthnSecondFactorUnavailableError=Việc xác minh yếu tố thứ hai tạm thời không khả dụng. Vui lòng thử lại sau giây lát.
AuthnTotpEnrolmentError=Không thể thiết lập ứng dụng xác thực. Vui lòng thử lại.
AuthnUnrecognizedUserIdError=ID người dùng không được nhận dạng
AuthnUserOrPasswordEmptyError=Người dùng và mật khẩu không được để trống
AuthnWrongUserOrPasswordError=Người dùng hoặc mật khẩu sai
CreateAccountAlreadyExistsError=Đã tồn tại tài khoản với địa chỉ email này
LoginLinkAlreadyUsedError=Liên kết này đã được sử dụng. Vui lòng tạo một liên kết mới từ trang đăng nhập.
LoginLinkExpiredError=Liên kết của bạn đã hết hạn.
LoginLinkUnrecognisedError=Liên kết này không được hệ thống nhận diện. Vui lòng tạo một liên kết mới từ trang đăng nhập.
VerificationCodeAttemptsExceededError=Quá nhiều mã sai. Vui lòng yêu cầu mã mới.
MagicLinkBusClosedError=Máy chủ không khả dụng, vui lòng thử lại sau.
MagicLinkPushError=Chúng tôi không thể kết nối với phiên làm việc gốc của bạn. Vui lòng đảm bảo rằng nó vẫn mở và kết nối internet.
MagicLinkUnexpectedError=Đã xảy ra lỗi trên máy chủ, xin lỗi\! Vui lòng gửi một yêu cầu mới bên dưới.
SupportViewNotPermittedError=Bạn không được phép mở chế độ xem hỗ trợ trên tài khoản khách hàng.
SupportViewInvalidTargetError=Không thể mở tài khoản này ở chế độ xem hỗ trợ.
SupportViewLinkInvalidError=Thẻ truy cập chế độ xem hỗ trợ này không hợp lệ, đã được sử dụng hoặc đã hết hạn.
