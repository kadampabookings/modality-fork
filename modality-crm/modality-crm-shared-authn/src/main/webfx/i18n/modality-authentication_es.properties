AuthnBackofficeMethodNotAllowedError=Esta forma de iniciar sesión no permite acceder al back-office.
AuthnNoSuchUserAccountError=No existe tal cuenta de usuario
AuthnOldPasswordNotMatchingError=La contraseña actual no coincide
AuthnPasswordSignInClosedError=El inicio de sesión con contraseña está desactivado en esta cuenta, así que no se le puede establecer una contraseña. Use su llave de acceso para iniciar sesión.
AuthnEmailSignInClosedError=Los enlaces y códigos de inicio de sesión están desactivados para esta cuenta, porque su inicio de sesión con contraseña está cerrado. Inicie sesión con su llave de acceso.
AuthnNoUsablePasskeyError=Añada una llave de acceso que pueda iniciar su sesión antes de desactivar su contraseña: sin ella, quedaría sin acceso a su cuenta.
AuthnLastPasskeyWhilePasswordClosedError=Esta es su última llave de acceso que puede iniciar su sesión, y su inicio de sesión con contraseña está desactivado. Añada otra llave de acceso, o vuelva a activar su contraseña, antes de eliminarla.
AuthnNewPasswordTooShortError=La nueva contraseña es demasiado corta: debe tener al menos 8 caracteres.
AuthnPasskeyAdminNotPermittedError=Solo un superadministrador puede aprobar o rechazar llaves de acceso.
AuthnPasskeyError=Error al iniciar sesión con la llave de acceso. Por favor, intente de nuevo o use otro método de inicio de sesión.
AuthnPasskeyManagementError=No se pudo completar el cambio de la llave de acceso. Por favor, intente de nuevo.
AuthnPasskeyNotApprovedError=Esta llave de acceso aún no ha sido aprobada para el back-office. Un administrador debe aprobarla primero.
AuthnPasskeyNotConfiguredError=El inicio de sesión con llave de acceso no está disponible en este servidor.
AuthnPasskeyRegistrationError=No se pudo registrar la llave de acceso. Por favor, intente de nuevo.
AuthnSecondFactorAttemptsExceededError=Demasiados intentos. Vuelva a iniciar sesión para empezar de nuevo.
AuthnSecondFactorCodeError=Ese código no es correcto. Compruebe su aplicación de autenticación e inténtelo de nuevo.
AuthnSecondFactorNotEnrolledError=Esta cuenta necesita un segundo factor para el back-office, y no se puede configurar aquí. Pida a un superadministrador que lo configure o lo restablezca por usted.
AuthnSecondFactorUnavailableError=La verificación del segundo factor no está disponible temporalmente. Vuelva a intentarlo en breve.
AuthnTotpEnrolmentError=No se pudo configurar la aplicación de autenticación. Por favor, intente de nuevo.
AuthnUnrecognizedUserIdError=ID de usuario no reconocido
AuthnUserOrPasswordEmptyError=El usuario y la contraseña no deben estar vacíos
AuthnWrongUserOrPasswordError=Usuario o contraseña incorrectos
CreateAccountAlreadyExistsError=Ya existe una cuenta con esta dirección de correo electrónico
LoginLinkAlreadyUsedError=Este enlace ya ha sido utilizado. Por favor, genere uno nuevo desde la página de inicio de sesión.
LoginLinkExpiredError=Su enlace ha expirado.
LoginLinkUnrecognisedError=Este enlace no es reconocido por el sistema. Por favor, genere uno nuevo desde la página de inicio de sesión.
VerificationCodeAttemptsExceededError=Demasiados códigos incorrectos. Solicite uno nuevo.
MagicLinkBusClosedError=El servidor no está disponible, intente más tarde.
MagicLinkPushError=No pudimos alcanzar su sesión original. Por favor, asegúrese de que aún esté abierta y conectada a Internet.
MagicLinkUnexpectedError=Ocurrió un error en el servidor, ¡lo sentimos\! Por favor, solicite uno nuevo a continuación.
SupportViewNotPermittedError=No tiene permiso para abrir una vista de soporte en cuentas de clientes.
SupportViewInvalidTargetError=Esta cuenta no se puede abrir en vista de soporte.
SupportViewLinkInvalidError=Este pase de vista de soporte es inválido, ya fue utilizado o ha expirado.
