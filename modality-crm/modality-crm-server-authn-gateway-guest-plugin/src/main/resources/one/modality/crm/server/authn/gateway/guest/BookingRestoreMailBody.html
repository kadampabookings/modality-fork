<html lang="en" dir="ltr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Kadampa Bookings</title>
    <style>
        body { margin:0; padding:0; background-color:#f3f4f6; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#1f2937; }
        .wrapper { width:100%; padding:32px 16px; box-sizing:border-box; }
        .email-container { max-width:560px; margin:0 auto; background-color:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 4px 24px rgba(15,23,42,0.06); }
        .brand-bar { padding:28px 24px 4px; text-align:center; }
        .brand { font-size:13px; font-weight:600; letter-spacing:0.12em; color:#009fe3; text-transform:uppercase; }
        .content { padding:8px 40px 32px; }
        h1 { margin:16px 0 8px; font-size:24px; font-weight:700; color:#0f172a; text-align:center; }
        p.lead { margin:0 0 24px; font-size:15px; line-height:1.55; color:#475569; text-align:center; }
        .cta-wrap { text-align:center; margin:28px 0 16px; }
        .cta-btn { display:inline-block; background-color:#009fe3; color:#ffffff !important; text-decoration:none; padding:14px 36px; border-radius:10px; font-weight:600; font-size:16px; }
        .fallback { margin:16px 0 0; font-size:12px; line-height:1.55; color:#94a3b8; text-align:center; }
        .fallback a { color:#009fe3; text-decoration:underline; word-break:break-all; }
        .footer { padding:24px 40px 32px; text-align:center; font-size:12px; color:#94a3b8; line-height:1.6; }
        .footer strong { color:#475569; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="email-container">
        <div class="brand-bar"><div class="brand">Kadampa Bookings</div></div>
        <div class="content">
            <h1>Access your booking</h1>
            <p class="lead">Click the button below to view your booking. No password needed.</p>
            [cartButtons]
        </div>
        <div class="footer">
            <p>If you didn't request this, you can safely ignore this email.<br>
            <strong>Kadampa Booking System</strong></p>
        </div>
    </div>
</div>
</body></html>
