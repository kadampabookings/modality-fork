# The web-push mailer job that drains channel='push' mails and transmits them as Web Push
# notifications. DISABLED by default, same reasoning as the SMTP mailer: a developer machine
# may point at a production database, and an accidentally-draining local server would push
# to real user devices. Production/staging enable it explicitly; local testing additionally
# requires enabledInDevelopment = true.
enabled = ${{ WEBPUSH_MAILER_ENABLED | false }}
enabledInDevelopment = ${{ WEBPUSH_MAILER_ENABLED_IN_DEVELOPMENT | false }}

# Idle poll interval, and the minimum spacing between two sends. No SMTP quota applies to
# push services — 500ms is just a courtesy pace.
pollIntervalMs = ${{ WEBPUSH_MAILER_POLL_INTERVAL_MS | 10000 }}
minSendIntervalMs = ${{ WEBPUSH_MAILER_MIN_SEND_INTERVAL_MS | 500 }}

# Only mails younger than this many days are drained (stops ancient stuck mails from
# suddenly going out).
drainWindowDays = ${{ WEBPUSH_MAILER_DRAIN_WINDOW_DAYS | 7 }}

# true: process the queue normally (bookkeeping included) but LOG instead of sending — the
# intended steady state on staging, whose database holds REAL device subscriptions after a
# prod→staging refresh. The push equivalent of MAIL_TRANSPORT_PROVIDER=sandbox; there is no
# redirect equivalent because push endpoints are opaque per-device capability URLs.
sandbox = ${{ WEBPUSH_MAILER_SANDBOX | false }}
