# The mailer job that drains the mail table and transmits through the mail transport.
# DISABLED by default: a developer machine may point at a production database, and an
# accidentally-draining local server would race the real mailer. Production/staging enable
# it explicitly; local testing additionally requires enabledInDevelopment = true.
enabled = ${{ MAILER_ENABLED | false }}
enabledInDevelopment = ${{ MAILER_ENABLED_IN_DEVELOPMENT | false }}

# Idle poll interval, and the minimum spacing between two sends (legacy KBS2 quota pace:
# 4s => ~900 emails/hour).
pollIntervalMs = ${{ MAILER_POLL_INTERVAL_MS | 10000 }}
minSendIntervalMs = ${{ MAILER_MIN_SEND_INTERVAL_MS | 4000 }}

# Only mails younger than this many days are drained (keeps the query fast on the ~1M-row
# mail table, and stops ancient stuck mails from suddenly going out).
drainWindowDays = ${{ MAILER_DRAIN_WINDOW_DAYS | 7 }}

# Non-empty: every recipient is replaced by this address (QA inbox) — the staging-rehearsal
# equivalent of KBS2's -DsendAllEmailsTo.
redirectTo = ${{ MAILER_REDIRECT_TO | '' }}

# flagged = only letterless mails + letters flagged kbs3 (progressive KBS2→KBS3
# handover); all = every untransmitted mail (final state, once KBS2's mailer is off).
drainScope = ${{ MAILER_DRAIN_SCOPE | 'flagged' }}
