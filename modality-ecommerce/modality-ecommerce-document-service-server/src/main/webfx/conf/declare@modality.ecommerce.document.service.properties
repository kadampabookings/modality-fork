# What the server needs to invite somebody into a room booker's spare bed.
#
# The invitation carries a bearer token: whoever opens the link can take the bed. So the link must be
# built on OUR origin and never on anything a caller supplies - an attacker-chosen origin would be handed
# the capability by the invitee's own mail client, which is the same reasoning the guest booking-recovery
# mail gives for ignoring the client's origin.
#
# Unset means no invitation is sent at all, and the booker is told so, rather than a mail going out with a
# link that leads nowhere. A missing invitation is recoverable - the cart still offers the link to copy -
# where a wrong one is not.

# Origin of the front office the invitation points at, with NO trailing slash, e.g.
# https://kadampabookings.org. The AWS deploys pass FRONTOFFICE_ORIGIN, the host that deploy serves the
# front office on.
frontofficeBaseUrl = ${{ FRONTOFFICE_ORIGIN }}
