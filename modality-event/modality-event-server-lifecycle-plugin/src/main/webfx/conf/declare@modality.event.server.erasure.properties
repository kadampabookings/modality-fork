# Personal-data removal from the back office (the Event Lifecycle page, super administrators only):
# erase_past_event() (V0077) run by the server, one event at a time, recorded in event_erasure_run (V0146).
#
# commitEnabled: whether a removal may COMMIT on this server. Only `true` (any case) turns it on; unset,
# anything else, and a configuration that never loaded all mean OFF, and the boot log says which state the
# server is in. Off, the page still runs DRY RUNS — the function's own proof, always rolled back — and a
# commit is refused with EventErasureCommitDisabledError. It ships off on purpose: the enablement ladder in
# docs/design/event-lifecycle-retention-design.md (aggregate repo) wants the DPO's sign-off before the back
# office can make an irreversible change. Turn it on per environment, staging first.
#
# HOW TO TURN IT ON. Declared WITH a default, like the mailer's switch, so it can never be accidentally on:
#   * the process environment: EVENT_ERASURE_COMMIT_ENABLED=true (local development, e.g. an IntelliJ run
#     configuration), or
#   * a conf-directory override: `commitEnabled = true` in conf/override@modality.event.server.erasure.properties
#     — how the AWS deploys set MAILER_ENABLED (see .github/workflows/docker/override@modality.base.server.mailer.properties.tpl
#     in the aggregate repo; this switch has no such template yet).
# NOT through public-variables.properties: a `${{ VAR | default }}` placeholder is substituted when the bundled
# config is first parsed, before the conf-directory variables files load, so the default would silently win
# (see declare@webfx.stack.session.token.properties). That failure is the safe one — commit stays off — but it
# would look like a switch that does not work.
#
# There is deliberately no retention setting: three months after the later of the event's end and its
# recordings closing is the managers' decision (D5), a constant in EventErasureConfig.
#
# AND: a declare@ file in a module is only read once `webfx update` has merged it into the server application's
# GENERATED src-root.json (kbs3/kbs-server-application-vertx/src/main/resources/dev/webfx/platform/conf/). The
# passkey gateway shipped inert on 2026-09-13 for want of that step. Missing, this switch reads as off and the
# boot log says the section is missing.
commitEnabled = ${{ EVENT_ERASURE_COMMIT_ENABLED | false }}
